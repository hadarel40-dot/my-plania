  fly={p0:camera.position.clone(),p1:pos.clone(),t0:lookTarget(),t1:look.clone(),f0:camera.fov,f1:fov,t:0,dur,bump,toMode};controls.enabled=false;}
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
function updateFly(dt){fly.t=Math.min(1,fly.t+dt/fly.dur);const e=ease(fly.t);camera.position.lerpVectors(fly.p0,fly.p1,e);camera.position.y+=Math.sin(Math.PI*e)*fly.bump;
  const tg=fly.t0.clone().lerp(fly.t1,e);camera.lookAt(tg);camera.fov=fly.f0+(fly.f1-fly.f0)*e;camera.updateProjectionMatrix();
  if(fly.t>=1){const m=fly.toMode;mode=m;applyVis(m);if(m==='fp'){const d=fly.t1.clone().sub(fly.p1).normalize();fp.yaw=Math.atan2(-d.x,-d.z);fp.pitch=Math.asin(Math.max(-1,Math.min(1,d.y)));fp.eye=fly.p1.y;}
    else{controls.target.copy(fly.t1);controls.enabled=true;controls.update();}fly=null;setModeButtons();}}
function goMode(m){if(m==='walk'){goRoom('entry');return;}showInfo(null);const v=VIEWS[m];flyTo(v.pos,v.look,m,v.fov,mode==='fp'?2.0:1.6);mode==='fp'&&(mode='fp');setModeButtonsPending(m);}
function setModeButtonsPending(m){for(const b of document.querySelectorAll('.modes [data-mode]'))b.classList.toggle('on',b.dataset.mode===(m==='fp'?'walk':m));}
function goRoom(id){const r=ROOMS[id];showInfo(id);infoLock=true;if(r.ext){flyTo(new THREE.Vector3(...r.ext.pos),new THREE.Vector3(...r.ext.look),'ext',45,1.8);setModeButtonsPending('ext');return;}
  const p=new THREE.Vector3(X(r.pos[0]),r.pos[2],Z(r.pos[1])),l=new THREE.Vector3(X(r.look[0]),r.look[2],Z(r.look[1]));flyTo(p,l,'fp',64,mode==='fp'?1.8:2.0);setModeButtonsPending('walk');}
for(const b of document.querySelectorAll('.modes [data-mode]'))b.addEventListener('click',()=>goMode(b.dataset.mode));

/* first-person controls */
const keys={},padK={};addEventListener('keydown',e=>{if(e.target.closest&&e.target.closest('button'))return;keys[e.code]=true;});addEventListener('keyup',e=>{keys[e.code]=false;});addEventListener('blur',()=>{for(const k in keys)keys[k]=false;});
for(const b of document.querySelectorAll('.padbtn')){const k=b.dataset.k;const on=e=>{e.preventDefault();padK[k]=true;b.classList.add('held');b.setPointerCapture&&b.setPointerCapture(e.pointerId);},off=()=>{padK[k]=false;b.classList.remove('held');};
  b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('lostpointercapture',off);}
function blockedAt(xm,zm,r=.2){const px=(xm+6.55)*100,py=(zm+4.725)*100,rc=r*100;if(px<PLOT.x1+20||px>PLOT.x2-20||py<PLOT.y1+20||py>PLOT.y2-20)return true;for(const b of collide)if(px>b.x1-rc&&px<b.x2+rc&&py>b.y1-rc&&py<b.y2+rc)return true;return false;}
function moveFP(dx,dz){const p=camera.position;const was=blockedAt(p.x,p.z);if(was||!blockedAt(p.x+dx,p.z))p.x+=dx;if(was||!blockedAt(p.x,p.z+dz))p.z+=dz;}
function roomAt(xm,zm){const px=(xm+6.55)*100,py=(zm+4.725)*100;for(const id of ['closet',...chipIds]){const r=ROOMS[id];for(const q of [r.rect,r.rect2]){if(q&&px>=q[0]&&px<=q[2]&&py>=q[1]&&py<=q[3])return id;}}
  if(px<0||px>1310||py<0||py>945)return 'garden';return null;}
function updateFP(dt){let f=0,s=0;if(keys.KeyW||keys.ArrowUp||padK.f)f+=1;if(keys.KeyS||keys.ArrowDown||padK.b)f-=1;if(keys.KeyD)s+=1;if(keys.KeyA)s-=1;
  if(keys.ArrowLeft||padK.tl)fp.yaw+=1.7*dt;if(keys.ArrowRight||padK.tr)fp.yaw-=1.7*dt;const spd=(keys.ShiftLeft||keys.ShiftRight?3:1.5)*dt;
  if(f||s){infoLock=false;const fx=-Math.sin(fp.yaw),fz=-Math.cos(fp.yaw),rx=Math.cos(fp.yaw),rz=-Math.sin(fp.yaw);moveFP((fx*f+rx*s)*spd,(fz*f+rz*s)*spd);}
  camera.position.y=fp.eye;camera.rotation.set(fp.pitch,fp.yaw,0,'YXZ');if(fly===null&&!infoLock){const r=roomAt(camera.position.x,camera.position.z);if(r&&r!==shownRoom)showInfo(r);}}
let drag=null,down=null;
canvas.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY,t:performance.now()};if(mode==='fp'&&!fly){drag={x:e.clientX,y:e.clientY};canvas.setPointerCapture(e.pointerId);}});
canvas.addEventListener('pointermove',e=>{if(drag&&mode==='fp'){const k=coarse?.006:.0042;fp.yaw+=(e.clientX-drag.x)*k;fp.pitch=Math.max(-1.2,Math.min(1.2,fp.pitch+(e.clientY-drag.y)*k));drag={x:e.clientX,y:e.clientY};}});
canvas.addEventListener('pointerup',e=>{drag=null;if(!down)return;const moved=Math.hypot(e.clientX-down.x,e.clientY-down.y),dt=performance.now()-down.t;down=null;if(moved<6&&dt<400&&!fly)handleClick(e);});
canvas.addEventListener('wheel',e=>{if(mode==='fp'&&!fly){e.preventDefault();const d=-Math.sign(e.deltaY)*.35;moveFP(-Math.sin(fp.yaw)*d,-Math.cos(fp.yaw)*d);}},{passive:false});
const ray=new THREE.Raycaster(),ndc=new THREE.Vector2();
function handleClick(e){const rc=canvas.getBoundingClientRect();ndc.set((e.clientX-rc.left)/rc.width*2-1,-(e.clientY-rc.top)/rc.height*2+1);ray.setFromCamera(ndc,camera);
  if(mode==='doll'){const h=ray.intersectObjects(floorMeshes,false)[0];if(h){const r=roomAt(h.point.x,h.point.z);if(r)goRoom(r);}return;}
  if(mode==='fp'){const hits=ray.intersectObjects(world.children,true);const h=hits.find(x=>x.object.visible&&x.object.material!==MAT.glass);if(h&&h.object.userData.walk&&h.distance<12){
      const p=h.point.clone();if(blockedAt(p.x,p.z))return;p.y=fp.eye;const d=new THREE.Vector3(-Math.sin(fp.yaw)*Math.cos(fp.pitch),Math.sin(fp.pitch),-Math.cos(fp.yaw)*Math.cos(fp.pitch));
      infoLock=false;flyTo(p,p.clone().add(d.multiplyScalar(3)),'fp',camera.fov,Math.max(.5,h.distance/3),false);}}}

/* minimap */
const mini=$('mini'),mctx=mini.getContext('2d');let mcol={};function readCols(){const cs=getComputedStyle(document.documentElement);mcol={fg:cs.getPropertyValue('--fg').trim(),ac:cs.getPropertyValue('--accent').trim(),room:cs.getPropertyValue('--plan-room').trim(),mu:cs.getPropertyValue('--muted').trim()};}
readCols();matchMedia('(prefers-color-scheme: dark)').addEventListener('change',readCols);new MutationObserver(readCols).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
function miniGeom(){const W=mini.clientWidth,Hh=mini.clientHeight,s=Math.min((W-10)/1310,(Hh-10)/945);return {W,Hh,s,ox:(W-1310*s)/2,oy:(Hh-945*s)/2};}
function drawMini(){const {W,Hh,s,ox,oy}=miniGeom();if(!W)return;const dpr=Math.min(devicePixelRatio,2);if(mini.width!==W*dpr){mini.width=W*dpr;mini.height=Hh*dpr;}
  const g=mctx;g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,W,Hh);const P=(x,y)=>[ox+x*s,oy+y*s];
  for(const id of chipIds){const r=ROOMS[id];for(const q of [r.rect,r.rect2]){if(!q)continue;const [a,b]=P(q[0],q[1]);g.fillStyle=id===shownRoom?mcol.ac:mcol.room;g.globalAlpha=id===shownRoom?.35:1;g.fillRect(a,b,(q[2]-q[0])*s,(q[3]-q[1])*s);g.globalAlpha=1;}}
  g.strokeStyle=mcol.fg;g.globalAlpha=.75;g.lineWidth=1;for(const w of WALLS){const [ax,c,a1,a2,t]=w;g.lineWidth=Math.max(1,t*s);g.beginPath();if(ax==='h'){g.moveTo(...P(a1,c));g.lineTo(...P(a2,c));}else{g.moveTo(...P(c,a1));g.lineTo(...P(c,a2));}g.stroke();}
  g.globalAlpha=1;if(mode==='fp'||fly){const px=(camera.position.x+6.55)*100,py=(camera.position.z+4.725)*100;const [cx,cyy]=P(px,py);const d=new THREE.Vector3();camera.getWorldDirection(d);const a=Math.atan2(d.z,d.x);
    if(cx>-20&&cx<W+20&&cyy>-20&&cyy<Hh+20){g.fillStyle=mcol.ac;g.globalAlpha=.35;g.beginPath();g.moveTo(cx,cyy);g.arc(cx,cyy,26,a-.5,a+.5);g.closePath();g.fill();g.globalAlpha=1;g.beginPath();g.arc(cx,cyy,4,0,7);g.fill();}}}
mini.addEventListener('click',e=>{const {s,ox,oy}=miniGeom();const rc=mini.getBoundingClientRect();const px=(e.clientX-rc.left-ox)/s,py=(e.clientY-rc.top-oy)/s;const r=roomAt(X(px),Z(py));if(r)goRoom(r);});

/* resize + loop */
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
addEventListener('resize',resize);resize();
camera.position.copy(VIEWS.ext.pos);controls.target.copy(VIEWS.ext.look);controls.update();applyVis('ext');showInfo(null);setModeButtons();setNight(false);
const clock=new THREE.Clock();let frame=0;
function tick(){const dt=Math.min(clock.getDelta(),.05);const t=clock.elapsedTime;
  if(fly)updateFly(dt);else if(mode==='fp')updateFP(dt);else controls.update();
  window.__flames.forEach((f,i)=>{const k=1+Math.sin(t*9+i*1.7)*.18+Math.sin(t*23+i)*.08;f.scale.set(1,k,1);f.position.y=.5+k*.08;});window.__fireL.intensity=night?7+Math.sin(t*13)*1.5+Math.sin(t*31)*.8:0;
  renderer.render(scene,camera);if((frame++&1)===0)drawMini();requestAnimationFrame(tick);}
tick();
requestAnimationFrame(()=>requestAnimationFrame(()=>$('loading').classList.add('done')));
window.__ready=true;
</script>
