<!doctype html>
<html><head><meta charset="utf-8"><title>Reel 1 - 4:30</title><link rel="stylesheet" href="engine.css"></head>
<body><div id="stage"></div>
<script src="engine.js"></script>
<script>
// Reel 1: "It's 4:30" - the daily dinner question, then the fix.

E.scene(0, 2.4, { bg: 'green' }, (root, api) => {
  const box = api.el(root, 'div', 'center');
  const clock = api.el(box, 'div', 'clock', '4:29<small>PM</small>');
  api.anim(clock, 0, 'pop', 0.35);
  api.words(box, "It's 4:30 PM.", 'lg', 0.9, 0.16);
  api.sfx('tick', 0.8);
  return (lt) => { clock.innerHTML = (lt < 0.8 ? '4:29' : '4:30') + '<small>PM</small>'; };
});

E.scene(2.4, 4.4, { bg: 'cream' }, (root, api) => {
  const box = api.el(root, 'div', 'center');
  api.words(box, "You're *still* at work.", 'xl', 0, 0.16);
});

E.scene(4.4, 7.6, { bg: 'ink', drift: 0.02 }, (root, api) => {
  api.anim(api.el(root, 'div', 'caps', '4:31 PM'), 0, 'fade', 0.3).style.marginBottom = '50px';
  const list = api.el(root, 'div', 'bubbles');
  [
    ['Kid #1', "what's for dinner", ''],
    ['Partner', 'do we have anything for dinner?', ''],
    ['Kid #2', 'MOM. DINNER???', 'loud'],
  ].forEach(([who, msg, cls], i) => {
    const row = api.el(list, 'div', 'bubble-row');
    api.el(row, 'div', 'sender', who);
    api.el(row, 'div', 'bubble ' + cls, msg);
    api.anim(row, 0.3 + i * 0.85, 'pop', 0.3);
    api.sfx('ping', 0.3 + i * 0.85);
  });
});

E.scene(7.6, 9.9, { bg: 'cream' }, (root, api) => {
  const box = api.el(root, 'div', 'center');
  api.words(box, 'Somehow you became', 'md', 0, 0.14);
  api.words(box, "the household's", 'lg', 0.5, 0.14);
  api.words(box, '*menu* *manager.*', 'xl', 0.85, 0.2);
});

E.scene(9.9, 11.7, { bg: 'green' }, (root, api) => {
  const box = api.el(root, 'div', 'center');
  api.words(box, 'On top of your', 'lg', 0, 0.14);
  api.words(box, '*actual* job.', 'xl', 0.45, 0.18);
});

E.scene(11.7, 14.2, { bg: 'cream' }, (root, api) => {
  const box = api.el(root, 'div', 'center');
  const l1 = api.el(box, 'div', 'lg');
  l1.innerHTML = "You don't need another <span class=\"strike-wrap\">tip.<span class=\"strike\"></span></span>";
  api.anim(l1, 0, 'up', 0.35);
  api.anim(l1.querySelector('.strike'), 0.7, 'strike', 0.3);
  api.sfx('pop', 0.7, 0.7);
  api.words(box, 'You need a *system.*', 'xl', 1.15, 0.16);
});

E.scene(14.2, 17.0, { bg: 'green', drift: 0.02 }, (root, api) => {
  captions(api, root, [['Plan the week *once.*', 0]]);
  const p = shot(api, api.el(root, 'div', 'phone-slot'), 'weekly.jpg', 120);
  api.anim(p.wrap, 0, 'up', 0.45);
  return p.update;
});

E.scene(17.0, 19.9, { bg: 'green', drift: 0.02 }, (root, api) => {
  const cap = captions(api, root, [['*One* tap.', 0], ['Breaking it into *groceries...*', 0.9]]);
  const p = clip(api, api.el(root, 'div', 'phone-slot'), 'clip-tap', 81, 0.1);
  api.sfx('tap', 0.1);
  api.sfx('ding', 1.6, 0.7);
  return (lt, d) => { cap(lt); return p.update(lt, d); };
});

E.scene(19.9, 21.4, { bg: 'green', drift: 0.02 }, (root, api) => {
  captions(api, root, [['*48* ingredients. Done.', 0]]);
  const p = clip(api, api.el(root, 'div', 'phone-slot'), 'clip-list', 44);
  return p.update;
});

E.scene(21.4, 23.4, { bg: 'ink' }, (root, api) => {
  const box = api.el(root, 'div', 'center');
  api.anim(api.el(box, 'div', 'wordmark', 'Plania'), 0, 'pop', 0.4);
  api.sfx('pop', 0);
  api.words(box, 'Planning made *pretty.*', 'md', 0.5, 0.14);
});

endCard(23.4, 25.6);
seek(0);
</script></body></html>
